<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Windows XP Holo Desk - GitHub 連動版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands & Camera -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: "Tahoma", "Microsoft JhengHei", sans-serif; background-color: #008080; }
        
        .xp-desktop {
            background: linear-gradient(to bottom, #1f509e 0%, #3e81ce 60%, #5d9ee3 100%);
            background-size: cover;
        }
        .xp-taskbar {
            background: linear-gradient(to bottom, #1f72ed 0%, #1754c0 10%, #195ed8 20%, #195ed8 88%, #1449ad 93%, #123e93 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }
        .xp-start-btn {
            background: linear-gradient(to bottom, #388e3c 0%, #2e7d32 50%, #1b5e20 100%);
            box-shadow: inset 1px 1px 1px rgba(255,255,255,0.6), 2px 2px 3px rgba(0,0,0,0.4);
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }
        .xp-window {
            background: #ece9d8;
            border: 3px solid #0055ea;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            box-shadow: 4px 4px 12px rgba(0,0,0,0.5);
        }
        .xp-window-header {
            background: linear-gradient(to right, #0058ee 0%, #388df8 89%, #0053ee 100%);
        }
        .xp-btn-close {
            background: linear-gradient(to bottom, #e06d53 0%, #c83719 50%, #a01c03 100%);
            border: 1px solid #fff;
        }

        #virtual-cursor {
            pointer-events: none;
            transition: transform 0.05s ease-out;
        }
        .cursor-pinched {
            background-color: rgba(255, 0, 128, 0.9) !important;
            box-shadow: 0 0 20px #ff0080;
            transform: scale(0.8);
        }
    </style>
</head>
<body class="h-screen w-screen select-none overflow-hidden xp-desktop relative">

    <!-- 手指虛擬滑鼠游標 -->
    <div id="virtual-cursor" class="fixed z-50 w-6 h-6 rounded-full bg-cyan-400/70 border-2 border-white shadow-lg -translate-x-1/2 -translate-y-1/2 flex items-center justify-center">
        <div class="w-1.5 h-1.5 bg-white rounded-full"></div>
    </div>

    <!-- 桌面圖示區域 -->
    <div class="p-4 grid grid-rows-6 grid-flow-col gap-6 w-max z-10 relative">
        <!-- 圖示 1: 我的電腦 -->
        <div onclick="openWindow('win-computer')" class="w-20 flex flex-col items-center cursor-pointer p-2 rounded hover:bg-white/20 border border-transparent hover:border-white/40">
            <div class="w-12 h-12 bg-blue-500/30 rounded-lg flex items-center justify-center border border-white/40 shadow text-2xl">💻</div>
            <span class="text-xs text-white text-center mt-1 drop-shadow font-medium">我的電腦</span>
        </div>

        <!-- 圖示 2: GitHub 雲端資料夾 (kaojarher.github.io) -->
        <div onclick="openGitHubFolder()" class="w-24 flex flex-col items-center cursor-pointer p-2 rounded hover:bg-white/20 border border-transparent hover:border-white/40">
            <div class="w-12 h-12 bg-amber-400/30 rounded-lg flex items-center justify-center border border-amber-300/50 shadow text-2xl">📁</div>
            <span class="text-xs text-white text-center mt-1 drop-shadow font-medium break-all leading-tight">kaojarher.github.io</span>
        </div>

        <!-- 圖示 3: 全息 3D 檢視器 -->
        <div onclick="openWindow('win-3d')" class="w-20 flex flex-col items-center cursor-pointer p-2 rounded hover:bg-white/20 border border-transparent hover:border-white/40">
            <div class="w-12 h-12 bg-cyan-500/30 rounded-lg flex items-center justify-center border border-cyan-300/40 shadow text-2xl">🧊</div>
            <span class="text-xs text-white text-center mt-1 drop-shadow font-medium">3D 檢視器</span>
        </div>

        <!-- 圖示 4: 系統記事本 -->
        <div onclick="openWindow('win-notepad')" class="w-20 flex flex-col items-center cursor-pointer p-2 rounded hover:bg-white/20 border border-transparent hover:border-white/40">
            <div class="w-12 h-12 bg-slate-500/30 rounded-lg flex items-center justify-center border border-slate-300/40 shadow text-2xl">📝</div>
            <span class="text-xs text-white text-center mt-1 drop-shadow font-medium">說明.txt</span>
        </div>
    </div>

    <!-- 視窗: GitHub 倉庫內容視窗 -->
    <div id="win-github" class="xp-window absolute top-10 left-10 w-[85vw] max-w-lg h-[450px] flex flex-col hidden z-20">
        <div class="xp-window-header h-8 px-2 flex justify-between items-center text-white font-bold text-xs cursor-move">
            <div class="flex items-center space-x-2">
                <span>📁</span>
                <span id="github-win-title">kaojarher.github.io (GitHub 連動)</span>
            </div>
            <button onclick="closeWindow('win-github')" class="xp-btn-close w-5 h-5 rounded flex items-center justify-center text-white font-black">×</button>
        </div>
        <!-- 檔案路徑列與操作工具列 -->
        <div class="bg-slate-200 border-b border-slate-300 px-3 py-1 flex items-center justify-between text-xs text-slate-700">
            <div class="flex items-center space-x-1">
                <span class="text-slate-500">網址:</span>
                <span class="bg-white px-2 py-0.5 rounded border border-slate-300 font-mono text-[11px] text-blue-700">https://github.com/kaojarher/kaojarher.github.io</span>
            </div>
            <button onclick="fetchGitHubRepo()" class="bg-slate-100 hover:bg-white px-2 py-0.5 rounded border border-slate-400 text-[10px]">重新整理</button>
        </div>
        <!-- 檔案展示區 -->
        <div class="p-4 bg-white flex-1 overflow-y-auto">
            <div id="github-file-list" class="grid grid-cols-3 gap-3">
                <div class="col-span-3 text-center text-slate-400 py-8 text-xs">正在從 GitHub 同步檔案清單...</div>
            </div>
        </div>
    </div>

    <!-- 視窗: 3D 檢視器 -->
    <div id="win-3d" class="xp-window absolute top-12 left-16 w-[85vw] max-w-md h-[400px] flex flex-col hidden z-20">
        <div class="xp-window-header h-8 px-2 flex justify-between items-center text-white font-bold text-xs">
            <div class="flex items-center space-x-2">
                <span>🧊</span>
                <span>全息 3D 檢視器</span>
            </div>
            <button onclick="closeWindow('win-3d')" class="xp-btn-close w-5 h-5 rounded flex items-center justify-center text-white font-black">×</button>
        </div>
        <div class="bg-slate-900 flex-1 relative overflow-hidden">
            <div id="3d-canvas-container" class="w-full h-full"></div>
            <div class="absolute bottom-2 left-2 right-2 flex justify-between">
                <button onclick="switch3DModel()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs px-3 py-1 rounded">切換模型</button>
            </div>
        </div>
    </div>

    <!-- 視窗: 我的電腦 -->
    <div id="win-computer" class="xp-window absolute top-20 left-20 w-[80vw] max-w-sm h-64 flex flex-col hidden z-20">
        <div class="xp-window-header h-8 px-2 flex justify-between items-center text-white font-bold text-xs">
            <div class="flex items-center space-x-2">
                <span>💻</span>
                <span>我的電腦</span>
            </div>
            <button onclick="closeWindow('win-computer')" class="xp-btn-close w-5 h-5 rounded flex items-center justify-center text-white font-black">×</button>
        </div>
        <div class="p-4 bg-white flex-1 text-slate-800 text-xs space-y-3">
            <div class="font-bold border-b pb-1">裝置與磁碟區</div>
            <div class="grid grid-cols-2 gap-2">
                <div class="p-2 border rounded flex items-center space-x-2">
                    <span class="text-xl">💽</span>
                    <div>
                        <div class="font-semibold">C: 系統磁碟</div>
                        <div class="text-[10px] text-slate-500">已使用 45 GB</div>
                    </div>
                </div>
                <div class="p-2 border rounded flex items-center space-x-2">
                    <span class="text-xl">🌐</span>
                    <div>
                        <div class="font-semibold">GitHub 雲端槽</div>
                        <div class="text-[10px] text-slate-500">kaojarher</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 視窗: 記事本視窗 -->
    <div id="win-notepad" class="xp-window absolute top-28 left-24 w-[80vw] max-w-xs h-64 flex flex-col hidden z-20">
        <div class="xp-window-header h-8 px-2 flex justify-between items-center text-white font-bold text-xs">
            <div class="flex items-center space-x-2">
                <span>📝</span>
                <span id="notepad-title">說明.txt</span>
            </div>
            <button onclick="closeWindow('win-notepad')" class="xp-btn-close w-5 h-5 rounded flex items-center justify-center text-white font-black">×</button>
        </div>
        <div class="bg-white flex-1 p-2">
            <textarea id="notepad-content" class="w-full h-full p-2 text-xs border-0 outline-none resize-none font-mono text-slate-800" readonly>
=== GitHub 連動桌面功能 ===

1. 點擊「kaojarher.github.io」資料匣。
2. 系統會自動發送 GitHub API 讀取倉庫資料夾中的結構與檔案。
3. 可使用前鏡頭手勢（食指移動游標、捏合點擊）直接開啓檔案。
            </textarea>
        </div>
    </div>

    <!-- 工作列與開始功能表 -->
    <footer class="fixed bottom-0 left-0 right-0 h-9 xp-taskbar z-40 flex justify-between items-center px-1">
        <div class="flex items-center space-x-2">
            <button class="xp-start-btn h-8 px-4 flex items-center space-x-2 text-white font-bold italic tracking-wide text-sm">
                <span>❖</span>
                <span>開始</span>
            </button>
            <div class="text-white/80 text-xs px-2 border-l border-white/20">Holo Desk GitHub-Sync</div>
        </div>
        <div class="bg-emerald-600 px-3 py-1 rounded text-white text-[11px] font-mono" id="clock">12:00 PM</div>
    </footer>

    <!-- 相機鏡頭即時小預覽 -->
    <div class="fixed bottom-11 right-3 z-40 w-24 h-32 rounded-lg overflow-hidden border-2 border-cyan-400 bg-black">
        <video id="webcam" class="w-full h-full object-cover transform -scale-x-100" playsinline></video>
        <div class="absolute bottom-0 inset-x-0 bg-black/70 text-[9px] text-cyan-300 text-center py-0.5" id="gestureStatus">搜尋手部...</div>
    </div>

    <!-- 邏輯腳本 -->
    <script>
        const GITHUB_USER = 'kaojarher';
        const GITHUB_REPO = 'kaojarher.github.io';

        let cursorX = window.innerWidth / 2;
        let cursorY = window.innerHeight / 2;
        let isPinched = false;
        let lastPinchState = false;

        let scene, camera, renderer, holoMesh;
        let modelType = 0;

        // 1. GitHub REST API 資料夾連動邏輯
        function openGitHubFolder() {
            openWindow('win-github');
            fetchGitHubRepo();
        }

        async function fetchGitHubRepo() {
            const listContainer = document.getElementById('github-file-list');
            listContainer.innerHTML = `<div class="col-span-3 text-center text-slate-400 py-8 text-xs">載入 GitHub API 檔案列表中...</div>`;

            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`);
                if (!response.ok) throw new Error('無法存取 GitHub 倉庫');
                
                const files = await response.json();
                listContainer.innerHTML = '';

                files.forEach(file => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'flex flex-col items-center p-2 rounded hover:bg-blue-100 cursor-pointer border border-transparent hover:border-blue-300';
                    
                    let icon = '📄';
                    if (file.type === 'dir') icon = '📁';
                    else if (file.name.endsWith('.html')) icon = '🌐';
                    else if (file.name.endsWith('.png') || file.name.endsWith('.jpg')) icon = '🖼️';

                    fileItem.innerHTML = `
                        <div class="text-2xl mb-1">${icon}</div>
                        <div class="text-[11px] text-slate-700 text-center truncate w-full" title="${file.name}">${file.name}</div>
                    `;

                    fileItem.onclick = () => handleFileClick(file);
                    listContainer.appendChild(fileItem);
                });
            } catch (err) {
                listContainer.innerHTML = `<div class="col-span-3 text-center text-rose-500 py-6 text-xs">讀取 GitHub 資料夾失敗：<br>${err.message}</div>`;
            }
        }

        function handleFileClick(file) {
            if (file.name.endsWith('.md') || file.name.endsWith('.txt')) {
                fetch(file.download_url)
                    .then(res => res.text())
                    .then(text => {
                        document.getElementById('notepad-title').innerText = file.name;
                        document.getElementById('notepad-content').value = text;
                        openWindow('win-notepad');
                    });
            } else if (file.type === 'file' && file.name.endsWith('.html')) {
                window.open(`https://${GITHUB_USER}.github.io/${file.name}`, '_blank');
            } else {
                alert(`開啟檔案：${file.name}\n檔案大小：${file.size} bytes`);
            }
        }

        // 2. 視窗控制
        function openWindow(id) {
            const win = document.getElementById(id);
            if (win) {
                win.classList.remove('hidden');
                bringToFront(win);
                if (id === 'win-3d' && !renderer) initThreeJS();
            }
        }

        function closeWindow(id) {
            const win = document.getElementById(id);
            if (win) win.classList.add('hidden');
        }

        function bringToFront(element) {
            document.querySelectorAll('.xp-window').forEach(w => w.style.zIndex = '20');
            element.style.zIndex = '30';
        }

        // 3. Three.js 3D 檢視器
        function initThreeJS() {
            const container = document.getElementById('3d-canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 4;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(2, 2, 5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040, 2));

            createModel();
            animate3D();
        }

        function createModel() {
            if (holoMesh) scene.remove(holoMesh);

            let geometry;
            if (modelType === 0) geometry = new THREE.IcosahedronGeometry(1.2, 1);
            else if (modelType === 1) geometry = new THREE.TorusKnotGeometry(0.8, 0.3, 100, 16);
            else geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);

            const material = new THREE.MeshStandardMaterial({
                color: 0x00ffff,
                wireframe: true,
                emissive: 0x003366
            });

            holoMesh = new THREE.Mesh(geometry, material);
            scene.add(holoMesh);
        }

        function switch3DModel() {
            modelType = (modelType + 1) % 3;
            createModel();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            if (holoMesh && !isPinched) holoMesh.rotation.y += 0.01;
            if (renderer) renderer.render(scene, camera);
        }

        // 4. MediaPipe Hands 追蹤與觸發
        function initCamera() {
            const videoElement = document.getElementById('webcam');
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults(onHandResults);

            const cameraInstance = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 320,
                height: 240,
                facingMode: 'user'
            });

            cameraInstance.start();
        }

        function onHandResults(results) {
            const cursor = document.getElementById('virtual-cursor');
            const status = document.getElementById('gestureStatus');

            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                status.innerText = "搜尋手部...";
                cursor.classList.remove('cursor-pinched');
                return;
            }

            status.innerText = "手指控制中";
            const landmarks = results.multiHandLandmarks[0];
            const indexTip = landmarks[8];
            const thumbTip = landmarks[4];

            cursorX = (1 - indexTip.x) * window.innerWidth;
            cursorY = indexTip.y * window.innerHeight;

            cursor.style.left = `${cursorX}px`;
            cursor.style.top = `${cursorY}px`;

            const dx = indexTip.x - thumbTip.x;
            const dy = indexTip.y - thumbTip.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            isPinched = distance < 0.08;

            if (isPinched) {
                cursor.classList.add('cursor-pinched');
                if (!lastPinchState) triggerVirtualClick(cursorX, cursorY);
                if (holoMesh) {
                    holoMesh.rotation.y = (cursorX / window.innerWidth - 0.5) * 5;
                    holoMesh.rotation.x = (cursorY / window.innerHeight - 0.5) * 5;
                }
            } else {
                cursor.classList.remove('cursor-pinched');
            }

            lastPinchState = isPinched;
        }

        function triggerVirtualClick(x, y) {
            const target = document.elementFromPoint(x, y);
            if (target) target.click();
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        window.onload = () => {
            initCamera();
        };
    </script>
</body>
</html>
